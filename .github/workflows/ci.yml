name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Py ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
        exclude:
          # Keep the matrix lean; 3.11 covered implicitly by local/dev.
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install report thumbnail library
        # The core CLI has no pip dependencies.
        # Pillow: HTML reports embed JPEG thumbnails when it is installed
        # (sips on macOS). Pillow 12 requires Python 3.10, so 3.9 stays on 11.x.
        # tzdata: Windows has no system IANA database, so zoneinfo needs it.
        run: python -m pip install --disable-pip-version-check "pillow>=10,<12" tzdata
      - name: Run unit tests
        env:
          ABSOLOOP_HOME: ${{ github.workspace }}
          # Windows runners still default to a legacy code page. UTF-8 mode
          # lets the CLI print its marks without UnicodeEncodeError.
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
